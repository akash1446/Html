</head>
<body>
    <form align="center">
        <h1 align="center"><img src="/images/Telegram.jpg" alt="Telegram" height="150" width="150"></h1>&emsp;
        <h3>Sign in to Telegram</h3>
        <p>Please confirm your  country code <br> And enter your phone number</p><br>
        Country :
        <select style="width: 300px;">
            <option value="none">-----none----</option>
            <option value="india">India (+91)</option>
            <option value="usa">USA (+1)</option>
            <option value="canada">Canada (+1)</option>
        </select><br><br>
        Phone Number :
        <input type="text" name="phonenumber" placeholder="------"  style="width: 300px;"><br><br>
        <input type="submit" name="nxtbutton" value="Keep me signed in" style="width: 400px; background-color:blue; color: white;"><br><br>
        <a href="loginby.html">LOG IN BY QR CODE</a>
    </form>
