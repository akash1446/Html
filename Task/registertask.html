<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Register page</title>
</head>
<body>
    <h1 align="center">Sathya Technologies Customer Register page</h1><hr>
    <form>  
       <table align="center">
        <tr>
            <tr><td><a href="Home2.html">Home</a></td></tr>
            <td>CustomerId</td><td><input type="text" name="customerId"></td></tr>
                <tr><td>UserName:</td><td><input type="text" name="userName"></td></tr>
                <tr><td>Password</td> <td><input type="password" name="password"></td></tr>
                <tr><td>Confirm Pwd:</td><td><input type="text" name="confirm Password"></td></tr>
                <tr><td>Gender:</td><td><input type="radio" name="gender">Male</td><td><input type="radio" name="gender" value="Female">Female</td>
                        <td><input type="radio" name="gender" value="others">Others</td></tr>
                <tr><td>Qualification</td><td><input type="checkbox" name="qualification" value="SSC">SSC</td>
                               <td><input type="checkbox" name="qualification" value="Inter">Inter</td>
                              <td><input type="checkbox" name="qualification" value="Degree">Degree</td>
                               <td><input type="checkbox" name="qualification" value="PG">PG</td></tr>
                <tr><td>State</td><td><select name="state" id="state">
                              <option value="none">---None---</option>
                              <option value="andhrapradesh">Andhra Pradesh</option>
                              <option value="telangana">Telangana</option>
                              </select></td></tr>
               <tr><td>City</td><td><select name="city" id="city" value="city">
                              <option value="none">---None---</option>
                              <option value="hyderabad">Hyderabad</option>
                              <option value="vijayawada">Vijayawada</option>
                              </select></td></tr>
                <tr><td>Email</td><td><input type="text" name="email"></td></tr>
                <tr><td>PhoneNumber</td><td><input type="text" name="phonenumber"></td></tr>
                                  <tr><td><input type="submit" name="btnregister" value="Register"></td>
                                   <td><input type="submit" name="btnclear" value="clear"></td></tr>
                                   <tr><td><p>Already Registered <a href="logintask2.html">Login</a></p></td></tr>
       </table>
    </form>
</body>
</html>
