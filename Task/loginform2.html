<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
</head>
<body>
    <h1 align="center">Sathya Technologies Company</h1><hr>
    <form>
        <table align="center">
            <tr>
            <td>Gender</td><td><input type="radio" name="gender" value="male">Male</td>
                       <td><input  type="radio" name="gender" value="Female">Female</td>
            <tr>
                <td>Languages:</td> <td><input type="checkbox" name="lang" value="Telugu">Telugu</td>
                               <td><input type="checkbox" name="lang" value="English">English</td>
                               <td><input type="checkbox" name="lang" value="Hindi">Hindi</td>;
                
            </tr>
            <tr>
                <td>State:</td>
                   <td><select >
                          <option value="select">-----select-----</option>
                          <option value="AP">Andhra Pradesh</option>
                          <option value="select">Madhya Pradesh</option>
                          <option value="select">Utara pradesh</option>
                          <option value="select">Telagana State</option>
                    </select>
                </td>
            </tr>

        </table>
    </form>
</body>
</html>
