<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
</head>
<body>
    <h1 align="center">Sathya Technologies Company</h1><hr>
    <form>
        <table align="center" width="60%">
            <tr>
            <th>Gender: <input type="radio" name="gender" value="male">Male &emsp;
                       <input  type="radio" name="gender" value="Female">Female</th></tr>
            <tr>
                <th>
                    Languages: <input type="checkbox" name="lang" value="Telugu">Telugu&emsp;
                               <input type="checkbox" name="lang" value="English">English&emsp;
                               <input type="checkbox" name="lang" value="Hindi">Hindi&emsp;
                               
                </th>
            </tr>
            <tr>
                <th>State:
                    <select multiple>
                          <option value="select">-----select-----</option>
                          <option value="AP">Andhra Pradesh</option>
                          <option value="select">Madhya Pradesh</option>
                          <option value="select">Utara pradesh</option>
                          <option value="select">Telagana State</option>
                    </select>
                </th>
            </tr>

        </table>
    </form>
</body>
</html>
