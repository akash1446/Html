<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
</head>
<body>
    <h1 align="center">Person Information</h1>
    <form>
        <table align="center">
            <tr>
                <td>Person Id</td>
                <td><input type="text" name="personId" value="person Id"></td>
            </tr>
            <tr>
                <td>Person Name</td>
                <td><input type="text" name="person Name"></td>
            </tr>
            <tr>
                <td>Age</td>
                <td><input type="text" name="Age"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td><input type="radio" name="gender" value="Male">Male</td>&nbsp;<td><input type="radio" name="gender" value="Female">Female</td>
            </tr>
            <tr>
                <td>Known Language:</td>
                <td><input type="checkbox" name="lang" value="English">English</td>&emsp;
                <td><input type="checkbox" name="lang" value="Telugu">Telugu</td>
            </tr>
            <tr>
                <td>State:</td>
                <td><select>
                      <option value="Select">----select----</option>
                      <option value="AP">Andhra Pradesh</option>
                      <option value="Select">Telagana</option>
                      <option value="Select">Madhya Pradesh</option>
                 </select></td>
            </tr>
        </table>
    </form>
    
</body>
</html>
