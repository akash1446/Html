<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration Page</title>
</head>
<body>
    <h1 align="center">Bank Customer</h1><hr>
    <form>
        <table align="center" width="50%" cellspacing="25px">
            <caption><h3>Customer Registration</h3></caption>
                
                  <tr><th>Cust ID  <input type="text" name="custid"></th></tr>
                  <tr><th>UserName <input type="text" name="userName"></th></tr>
                    <tr><th>password: <input type="password" name="password"></th></tr>
                    <tr><th>Gender:   <input type="radio" name="gender" value="Male">Male <br> <input type="radio" name="gender" value="Female">Female</th></tr>
                   <tr><th>Qualification:<select>
                                    <option value="none">----None---</option>
                                    <option value="10th">10th</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="bachelor">Bachelor's Degree</option>
                                    <option value="master">Master's Degree</option>
                                </select></th></tr>
                  <tr><th>State:<select>
                                  <option value="none">----None---</option>
                                  <option value="andhra pradesh">Andhra Pradesh</option>
                                  <option value="telangana">Telangana</option>
                                  <option value="karnataka">Karnataka</option>
                                  <option value="tamil nadu">Tamil Nadu</option>
                               </select></th></tr>
                    <tr><th>City:<select>
                                     <option value="none">----None---</option>
                                     <option value="hyderabad">Hyderabad</option>
                                     <option value="vijayawada">Vijayawada</option>
                                    <option value="vizag">Vizag</option>
                                    <option value="bangalore">Bangalore</option>
                            </select> </th></tr>
               <tr><th>phoneNumber:<input type="text" name="phoneNumber"></th></tr>
                        <tr><th><input type="submit" name="btnregister" value="Register">
                                <input type="submit" name="btnreset" value="Reset"></th></tr>
        </table>
    </form>
</body>
</html>
