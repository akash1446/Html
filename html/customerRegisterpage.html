<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration Page</title>
</head>
<body>
    <h1 align="center">Bank Customer</h1><hr>
    <form>
        <table align="center">
            <caption><h3>Customer Registration</h3></caption>
                
                  <tr><td>Cust ID</td> <td><input type="text" name="custid"></td></tr>
                  <tr><td>UserName</td> <td><input type="text" name="userName"></td></tr>
                    <tr><td>password</td> <td><input type="password" name="password"></td></tr>
                    <tr><td>Gender</td>  <td><input type="radio" name="gender" value="Male">Male </td>&emsp;<td><input type="radio" name="gender" value="Female">Female</td></tr>
                   <tr><td>Qualification:</td><td><select>
                                    <option value="none">----None---</option>
                                    <option value="10th">10th</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="bachelor">Bachelor's Degree</option>
                                    <option value="master">Master's Degree</option>
                                </select></td></tr>
                  <tr><td>State:</td><td><select>
                                  <option value="none">----None---</option>
                                  <option value="andhra pradesh">Andhra Pradesh</option>
                                  <option value="telangana">Telangana</option>
                                  <option value="karnataka">Karnataka</option>
                                  <option value="tamil nadu">Tamil Nadu</option>
                               </select></td></tr>
                    <tr><td>City:</td><td><select>
                                     <option value="none">----None---</option>
                                     <option value="hyderabad">Hyderabad</option>
                                     <option value="vijayawada">Vijayawada</option>
                                    <option value="vizag">Vizag</option>
                                    <option value="bangalore">Bangalore</option>
                            </select> </td></tr>
               <tr><td>phoneNumber:</td><td><input type="text" name="phoneNumber"></td></tr>
                        <tr><td><input type="submit" name="btnregister" value="Register"></td>
                        <td><input type="submit" name="btnreset" value="Reset"></td></tr>
        </table>
    </form>
</body>
</html>
